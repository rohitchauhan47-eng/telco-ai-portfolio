<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telco AI Transformation Portfolio | Rohit Chauhan</title>
  <meta name="description" content="Connected telecom AI agents for Sales, Marketing, Customer Support, Revenue Assurance and Operations, built while learning Gen AI and Agentic AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">   <!-- written by edit mode: section widths, spacing, text sizes -->
</head>
<body>
  <!-- This file is only the frame. All words come from data/site.json; js/render.js fills them in. -->
  <a class="skip" href="#main">Skip to content</a>

  <header class="bar">
    <div class="wrap">
      <a class="who" href="#top" id="site-name"></a>
      <nav id="nav" aria-label="Sections"></nav>
    </div>
  </header>

  <main id="main">
    <section class="intro" id="top">
      <div class="wrap">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="headline"></h1>
        <p class="lead" id="idea"></p>
        <div class="goals" id="goals"></div>
        <p class="by" id="by"></p>
      </div>
    </section>

    <section class="s" id="big-picture">
      <div class="wrap">
        <div data-head></div>
        <figure class="fig">
          <div id="bigpic"></div>
          <figcaption class="cap" data-caption></figcaption>
        </figure>
      </div>
    </section>

    <section class="s" id="who-helps">
      <div class="wrap">
        <div data-head></div>
        <figure class="fig">
          <div id="grid"></div>
          <figcaption class="cap" data-caption></figcaption>
        </figure>
      </div>
    </section>

    <section class="s" id="story">
      <div class="wrap">
        <div data-head></div>
        <div class="controls">
          <button class="btn primary" id="play" type="button">▶ Play the story</button>
          <button class="btn" id="back" type="button">‹ Back</button>
          <button class="btn" id="next" type="button">Next ›</button>
          <span class="tag" id="story-label"></span>
        </div>
        <figure class="fig">
          <div id="story-chain"></div>
          <div class="step" aria-live="polite">
            <p class="step-no" id="step-no"></p>
            <h3 id="step-title"></h3>
            <p id="step-text"></p>
          </div>
          <figcaption class="cap" data-caption></figcaption>
        </figure>
      </div>
    </section>

    <section class="s" id="agents">
      <div class="wrap">
        <div data-head></div>
        <p class="cap" id="status-note"></p>
        <div id="agent-groups"></div>
      </div>
    </section>

    <section class="s" id="skills">
      <div class="wrap">
        <div data-head></div>
        <div id="skill-groups"></div>
        <h3 class="sub" id="courses-title"></h3>
        <ul class="courses" id="courses"></ul>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p id="footer-text"></p>
      <p class="by" id="footer-links"></p>
    </div>
  </footer>

  <noscript><p class="wrap">This page needs JavaScript to draw its diagrams.</p></noscript>
  <script src="js/render.js" defer></script>
  <script src="js/player.js" defer></script>
</body>
</html>
