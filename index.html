<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Telco AI Transformation Portfolio | Rohit Chauhan</title><meta name="description" content="Connected telecom AI agents for Sales, Marketing, Revenue Assurance and Operations, built while learning Gen AI and Agentic AI."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><style id="pf-style">/* Layout: single white page, max 1120px column. Intro → big-picture team diagram → story player → agent cards by function → concepts grid. Deliberately one light theme: white background, blue type. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --tint:#F2F7FE; --tint2:#E3EDFB; --line:#C7D8F2;
  --navy:#0A2A66; --blue:#1557B0; --mid:#3F74C4; --soft:#6E8FC2; --ink-on:#FFFFFF;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",Calibri,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--navy);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);color:var(--navy);margin:0;text-wrap:balance}
a{color:var(--blue)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-block:9px;flex-wrap:wrap}
.bar .who{font:700 15px var(--f-display);color:var(--navy);white-space:nowrap}
.bar nav{display:flex;gap:2px;overflow-x:auto;flex:1 1 260px;min-width:0;scrollbar-width:none}
.bar nav a{color:var(--blue);text-decoration:none;font-size:14px;padding:4px 9px;border-radius:5px;white-space:nowrap}
.bar nav a:hover{background:var(--tint2)}
.btn{font:600 13.5px var(--f-body);border-radius:6px;padding:6px 12px;border:1px solid var(--blue);background:var(--bg);color:var(--blue);cursor:pointer}
.btn:hover{background:var(--tint)}.btn.primary{background:var(--blue);color:var(--ink-on)}
.btn[disabled]{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.note{background:var(--tint2);color:var(--navy);font-size:14px}.note .wrap{padding-block:8px}

/* intro */
.intro{padding-block:52px 30px;border-bottom:1px solid var(--line)}
.eyebrow{font:600 12px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mid)}
.intro h1{font-size:clamp(34px,5.4vw,56px);font-weight:800;line-height:1.05;margin:12px 0 16px;letter-spacing:-.01em}
.intro .lead{font-size:clamp(18px,2.1vw,21px);color:var(--blue);max-width:62ch;margin:0 0 22px}
.goal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:8px 0 22px}
.g{border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--tint);min-width:0}
.g b{display:block;font:800 26px var(--f-display);color:var(--blue);line-height:1}
.g span{display:block;font-weight:700;color:var(--navy);margin-top:6px}
.g small{display:block;color:var(--soft);font-size:14px;margin-top:2px}
.by{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:var(--mid);font-size:15px}
.by a.chip{border:1px solid var(--blue);border-radius:20px;padding:4px 12px;text-decoration:none;font-weight:600}

section.s{padding-block:46px 8px;scroll-margin-top:62px}
.s-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.s-head .num{font:700 13px var(--f-mono);color:var(--soft)}
.s-head h2{font-size:clamp(24px,3vw,32px);flex:1 1 auto}
.sec-btn{font:600 13px var(--f-body);color:var(--blue);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
.lede{color:var(--mid);margin:2px 0 18px;max-width:75ch}

.fig{border:1.5px solid var(--line);border-radius:14px;padding:14px;overflow-x:auto;margin:0;background:var(--bg)}
.fig svg{display:block;width:100%;height:auto;min-width:680px}
.cap{color:var(--soft);font-size:14px;margin:8px 2px 0}

/* svg classes */
.n{cursor:pointer}
.n .b{fill:var(--bg);stroke:var(--blue);stroke-width:1.6}
.n:hover .b,.n:focus .b{stroke-width:3}
.n:focus{outline:none}
.n.sel .b,.n.act .b{stroke:var(--navy);stroke-width:3.5;fill:var(--tint2)}
.n.dim{opacity:.35}
.s-prog .b{fill:var(--tint2)}
.s-later .b,.s-plan .b{stroke-dasharray:6 4}
.s-design .b{stroke-dasharray:2 4;stroke:var(--soft)}
.tt{fill:var(--navy);font:700 14.5px var(--f-body)}
.ts{fill:var(--mid);font:400 12.5px var(--f-body)}
.tm{fill:var(--soft);font:600 10.5px var(--f-mono);letter-spacing:.08em}
.tw{fill:#fff;font:700 15px var(--f-display);letter-spacing:.02em}
.tws{fill:#DCE8FA;font:400 12.5px var(--f-body)}
.hd{fill:var(--blue)}
.dk{fill:var(--navy)}
.col{fill:var(--tint);stroke:var(--line);stroke-width:1.2}
.ln{stroke:var(--line);stroke-width:1.6;fill:none}
.ln.on{stroke:var(--navy);stroke-width:3}
.fl{stroke:var(--blue);stroke-width:2;fill:none}
.ah{fill:var(--blue)}
.badge{fill:var(--tint2)}
.bt{fill:var(--blue);font:700 9.5px var(--f-mono);letter-spacing:.05em}

.panel{border:1.5px solid var(--blue);border-radius:12px;padding:16px 18px;margin-top:12px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start;background:var(--tint)}
.panel h3{font-size:21px}
.k{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin-top:10px}
.panel p{margin:2px 0 0}

.player{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.play{font:700 14px var(--f-body);border-radius:20px;padding:7px 16px;border:1.5px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer}
.play.sec{background:var(--bg);color:var(--blue)}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--navy)}
.story{border-left:4px solid var(--blue);background:var(--tint);border-radius:0 10px 10px 0;padding:12px 16px;margin-top:12px}
.story h3{font-size:18px;margin-bottom:4px}

/* cards */
.fn{margin-top:26px}
.fn h3.fh{font:700 13px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:6px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fh span{color:var(--soft);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.card{border:1.5px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--bg)}
.card.s-later,.card.s-plan{border-style:dashed}.card.s-design{border-style:dotted}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h4{font:700 19px var(--f-display);color:var(--navy);margin:0}
.card p{margin:0}
.pill{font:700 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;white-space:nowrap;border:1.5px solid var(--blue);color:var(--blue)}
.pill.p-prog{background:var(--blue);color:#fff}
.pill.p-later,.pill.p-plan{border-style:dashed}
.pill.p-design{border-style:dotted;color:var(--soft);border-color:var(--soft)}
.flow{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.flow div{flex:1 1 0;min-width:84px;background:var(--tint);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13.5px;color:var(--navy)}
.flow div small{display:block;font:600 10px var(--f-mono);letter-spacing:.06em;color:var(--soft);text-transform:uppercase}
.flow i{align-self:center;color:var(--blue);font-style:normal;font-weight:700}
.learn{font-size:14.5px;color:var(--mid)}.learn b{color:var(--navy)}
.go{margin-top:auto;display:inline-flex;justify-content:center;align-items:center;gap:6px;font:700 14.5px var(--f-body);padding:9px 14px;border-radius:8px;text-decoration:none;background:var(--blue);color:#fff}
.go.off{background:var(--tint);color:var(--soft);border:1px dashed var(--line)}
.urlin{width:100%;font:14px var(--f-mono);padding:6px 8px;border:1px solid var(--blue);border-radius:6px;color:var(--navy);background:#fff}

.tbl{overflow-x:auto;border:1.5px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:15px}
th{background:var(--tint2);color:var(--navy);font:700 13px var(--f-body);padding:9px 10px;text-align:center}
th:first-child{text-align:left}
td{border-top:1px solid var(--line);padding:9px 10px;text-align:center}
td:first-child{text-align:left;font-weight:700;color:var(--navy)}
td small{display:block;font-weight:400;color:var(--mid)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--blue)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13.5px;color:var(--mid);margin-top:10px}

footer{padding-block:44px 64px;color:var(--mid);font-size:14.5px;border-top:1px solid var(--line);margin-top:50px}
body.editing [data-k]{outline:1px dashed var(--blue);outline-offset:3px;border-radius:3px;cursor:text}
@media (max-width:820px){.goal{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

    s+='<rect x="'+x+'" y="120" width="'+CW+'" height="330" rx="12" class="col"/><rect x="'+x+'" y="120" width="'+CW+'" height="42" rx="12" class="hd"/><rect x="'+x+'" y="148" width="'+CW+'" height="14" class="hd"/>'+t(x+CW/2,147,f.name.toUpperCase(),"tw","middle");
    STATE.agents.filter(function(a){return a.fn===f.id;}).forEach(function(a,j){
      var y=174+j*90, st=SC[a.status]||"plan", w=CW-20, bl=a.status.toUpperCase();
      s+='<g class="n s-'+st+(sel===a.id?" sel":"")+(sel&&sel!==a.id?" dim":"")+'" data-node="'+a.id+'" tabindex="0" role="button" aria-label="'+esc(a.name)+'"><rect x="'+(x+10)+'" y="'+y+'" width="'+w+'" height="78" rx="9" class="b"/>';
      s+=t(x+22,y+26,a.name,"tt")+t(x+22,y+45,a.output,"ts");
      s+='<rect x="'+(x+22)+'" y="'+(y+54)+'" width="'+(bl.length*6.6+14)+'" height="16" rx="8" class="badge"/>'+t(x+29,y+65.5,bl,"bt")+"</g>";
    });
  });
  // outcomes
  [[20,470,"Revenue increased","more sales, customers kept"],[510,225,"Revenue protected","fraud prevented"],[755,225,"OPEX reduced","fewer calls, less manual work"]].forEach(function(o){
    s+='<rect x="'+o[0]+'" y="500" width="'+o[1]+'" height="72" rx="12" class="dk"/>'+t(o[0]+o[1]/2,530,o[2],"tw","middle")+t(o[0]+o[1]/2,552,o[3],"tws","middle");});
  COLX.forEach(function(x){s+='<line x1="'+(x+CW/2)+'" y1="452" x2="'+(x+CW/2)+'" y2="494" class="fl" marker-end="url(#ah)"/>';});
  s+=t(20,592,"BUSINESS OUTCOMES FOR THE TELCO","tm");
  return s+"</svg>";
}
function panel(){
  if(!sel) return '<p class="cap">Click any agent in the diagram to see what it does and open its app. Solid border = being built; dashed = planned or later; dotted = design only.</p>';
  var a=A(sel), i=ix(sel), f=STATE.functions.filter(function(x){return x.id===a.fn;})[0];
  return '<div class="panel"><div><div class="k">'+esc(f?f.name:"Shared")+' team</div><h3>'+esc(a.name)+"</h3>"+pill(a.status)+'<div class="k">What it does</div>'+E("p","agents."+i+".purpose")+'<div class="k">How it works</div>'+flow(a)+'</div><div><div class="k">Shows I can use</div>'+E("p","agents."+i+".learn")+'<div style="margin-top:14px">'+link(a)+"</div></div></div>";
}
function flow(a){return '<div class="flow"><div><small>Input</small>'+esc(a.io[0])+'</div><i>→</i><div><small>Brain</small>'+esc(a.io[1])+'</div><i>→</i><div><small>Output</small>'+esc(a.io[2])+"</div></div>";}

/* ---------- 2. story ---------- */
function storySVG(){
  var S=STATE.story, s=svgOpen(1000,170,"One customer case moving across teams");
  S.forEach(function(st,i){var x=20+i*165, on=step===i;
    s+=t(x+72,30,st.team.toUpperCase(),"tm","middle");
    s+='<g class="n'+(on?" act":"")+(step>=0&&!on?" dim":"")+'" data-step="'+i+'" tabindex="0" role="button" aria-label="Step '+(i+1)+'"><rect x="'+x+'" y="42" width="145" height="96" rx="10" class="b"/>'+t(x+72,74,(i+1)+"  "+st.who,"tt","middle")+t(x+72,96,st.short,"ts","middle")+t(x+72,116,st.short2||"","ts","middle")+"</g>";
    if(i<S.length-1) s+='<line x1="'+(x+147)+'" y1="90" x2="'+(x+162)+'" y2="90" class="fl" marker-end="url(#ah)"/>';});
  return s+"</svg>";
}

/* ---------- 3. cards ---------- */
function cards(){
  var groups=STATE.functions.concat([{id:"shared",name:"Shared",outcome:"connects all teams"}]);
  return groups.map(function(f){
    var list=STATE.agents.filter(function(a){return a.fn===f.id;}); if(!list.length) return "";
    return '<div class="fn"><h3 class="fh">'+esc(f.name)+"<span>"+esc(f.outcome)+'</span></h3><div class="cards">'+list.map(function(a){var i=ix(a.id),st=SC[a.status]||"plan";
      var h='<article class="card s-'+st+'" id="card-'+a.id+'"><div class="top"><h4>'+esc(a.name)+"</h4>";
      h+= editing?'<select id="st-'+a.id+'" data-st="'+i+'" aria-label="Status">'+Object.keys(SC).map(function(o){return "<option"+(o===a.status?" selected":"")+">"+o+"</option>";}).join("")+"</select>":pill(a.status);
      h+="</div>"+E("p","agents."+i+".purpose")+flow(a)+'<div class="learn"><b>Shows I can use: </b>'+E("span","agents."+i+".learn")+"</div>";
      h+= editing?'<label class="learn" for="url-'+a.id+'">App link (Streamlit address)</label><input class="urlin" id="url-'+a.id+'" data-url="'+i+'" value="'+esc(a.url||"")+'" placeholder="https://...">':link(a);
      return h+"</article>";}).join("")+"</div></div>";}).join("");
}

/* ---------- 4. concepts ---------- */
function concepts(){
  var cols=STATE.conceptCols;
  return '<div class="tbl"><table><thead><tr><th>Concept</th>'+cols.map(function(c){return '<th title="'+esc(A(c).name)+'">'+esc(A(c).abbr)+"</th>";}).join("")+"</tr></thead><tbody>"+STATE.concepts.map(function(c,i){return "<tr><td>"+esc(c.name)+E("small","concepts."+i+".plain")+"</td>"+cols.map(function(col){return "<td>"+(c.agents.indexOf(col)>=0?'<span class="dot" title="used"></span>':"")+"</td>";}).join("")+"</tr>";}).join("")+'</tbody></table></div><div class="legend">'+cols.map(function(c){return "<span><b>"+esc(A(c).abbr)+"</b> "+esc(A(c).name)+"</span>";}).join("")+"</div>";
}

/* ---------- page ---------- */
function render(){
  var y=window.scrollY, T=STATE.text;
  var h='<div class="bar"><div class="wrap"><span class="who">Telco AI Transformation Portfolio</span><nav aria-label="Sections"><a href="#picture">Big picture</a><a href="#story">How they work together</a><a href="#agents">The agents</a><a href="#learning">What I’m learning</a></nav>';
  if(!STATIC&&artifactNS&&!readOnly) h+= editing?'<button class="btn" id="discard" type="button">Discard</button><button class="btn primary" id="save" type="button">Save changes</button>':'<button class="btn" id="edit" type="button">Edit</button>';
  h+="</div></div>";
  if(editing) h+='<div class="note"><div class="wrap">Edit mode: click outlined text to change it, set statuses, and paste app links into the agent cards. Save publishes the new version.</div></div>';
  h+='<header class="intro"><div class="wrap"><div class="eyebrow">'+E("span","text.eyebrow")+"</div>"+E("h1","text.title")+E("p","text.lead","lead")+'<div class="goal">'+STATE.goals.map(function(g,i){return '<div class="g"><b>'+esc(g.sym)+"</b>"+E("span","goals."+i+".name")+E("small","goals."+i+".how")+"</div>";}).join("")+'</div><div class="by">'+E("span","text.by")+STATE.links.map(function(l){return '<a class="chip" href="'+esc(l.v)+'" target="_blank" rel="noopener">'+esc(l.k)+" ↗</a>";}).join("")+"</div></div></header>";
  h+='<main class="wrap">';
  h+='<section class="s" id="picture">'+head("picture","01","The big picture: AI agents working for each telco team","text.pictureLede")+'<figure class="fig">'+bigPicture()+"</figure>"+panel()+"</section>";
  h+='<section class="s" id="story">'+head("story","02","How the agents work together: one customer case","text.storyLede")+'<div class="player"><button class="play" type="button" id="play">'+(timer?"Pause":step>=0?"Continue":"▶ Play the story")+'</button><button class="play sec" type="button" id="prev">‹ Back</button><button class="play sec" type="button" id="next">Next ›</button><span class="dots" aria-hidden="true">'+STATE.story.map(function(_,i){return '<i class="'+(i===step?"on":"")+'"></i>';}).join("")+'</span></div><figure class="fig">'+storySVG()+"</figure>";
  h+= step>=0?'<div class="story"><div class="k" style="margin-top:0">Step '+(step+1)+" of "+STATE.story.length+" · "+esc(STATE.story[step].team)+"</div><h3>"+esc(STATE.story[step].title)+"</h3>"+E("p","story."+step+".text")+"</div>":'<p class="cap">Press Play, or click a step. Made-up customer and figures.</p>';
  h+="</section>";
  h+='<section class="s" id="agents">'+head("agents","03","The agents, team by team","text.agentsLede")+cards()+"</section>";
  h+='<section class="s" id="learning">'+head("learning","04","What I’m learning, and where I use it","text.learnLede")+concepts()+"</section>";
  h+="</main>"+'<footer><div class="wrap">'+E("p","text.footer")+"</div></footer>";
  app.innerHTML=h;
  document.body.classList.toggle("editing",editing);
  if(editing) app.querySelectorAll("[data-k]").forEach(function(el){el.setAttribute("contenteditable","true");});
  window.scrollTo(0,y);
}

/* ---------- story player ---------- */
function stop(){if(timer){clearInterval(timer);timer=null;}}
function go(n){if(editing)collect();step=Math.max(0,Math.min(STATE.story.length-1,n));render();}
function play(){if(timer){stop();render();return;} if(step>=STATE.story.length-1)step=-1; go(step+1);
  timer=setInterval(function(){if(step>=STATE.story.length-1){stop();render();return;}go(step+1);},4200); render();}

/* ---------- save ---------- */
var KEEP={B:1,STRONG:1,I:1,EM:1,BR:1,LI:1};
function clean(n){Array.prototype.slice.call(n.childNodes).forEach(function(c){if(c.nodeType===3)return;if(c.nodeType!==1){c.remove();return;}clean(c);if(KEEP[c.tagName]){while(c.attributes.length)c.removeAttribute(c.attributes[0].name);return;}var f=document.createDocumentFragment();if((c.tagName==="DIV"||c.tagName==="P")&&c.previousSibling)f.appendChild(document.createElement("br"));while(c.firstChild)f.appendChild(c.firstChild);c.replaceWith(f);});}
function collect(){
  app.querySelectorAll("[data-k]").forEach(function(el){var c=el.cloneNode(true);clean(c);set(el.getAttribute("data-k"),c.innerHTML.replace(/&nbsp;/g," ").trim());});
  app.querySelectorAll("[data-url]").forEach(function(el){STATE.agents[+el.dataset.url].url=el.value.trim();});
  app.querySelectorAll("[data-st]").forEach(function(el){STATE.agents[+el.dataset.st].status=el.value;});
}
function buildDoc(){var rs=document.head.querySelector("style"),reset=rs?rs.textContent:":root{color-scheme:light}body{margin:0}",END="</"+"script>";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+"</style></head><body>"+HEAD_BITS+'<style id="pf-style">'+CSS_SRC+'</style><div id="app"></div><script type="application/json" id="pf-state">'+JSON.stringify(STATE).replace(/</g,"\\u003c")+END+'<script id="pf-main">'+MAIN_SRC+END+"</body></html>";}
function save(b){collect();b.disabled=true;b.textContent="Saving…";
  artifactNS.publish(buildDoc()).then(function(){b.textContent="Saved";}).catch(function(e){var c=e&&e.code;
    if(c==="conflict"){b.textContent="Newer version loading";return;}
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"||c==="capability_disabled"){readOnly=true;editing=false;render();return;}
    b.disabled=false;b.textContent=c==="rate_limited"?"Too many saves, wait":"Save failed, try again";});}

/* ---------- events ---------- */
function pick(id){if(editing)collect();sel=sel===id?null:id;render();}
app.addEventListener("click",function(ev){
  var n=ev.target.closest("[data-node]"); if(n){pick(n.dataset.node);return;}
  var sp=ev.target.closest("[data-step]"); if(sp){stop();go(+sp.dataset.step);return;}
  var b=ev.target.closest("button"); if(!b) return;
  if(b.id==="play") play(); else if(b.id==="next"){stop();go(step+1);} else if(b.id==="prev"){stop();go(step-1);}
  else if(b.id==="edit"){stop();editing=true;render();}
  else if(b.id==="discard"){STATE=JSON.parse(document.getElementById("pf-state").textContent);editing=false;render();}
  else if(b.id==="save") save(b);
  else if(b.dataset.discuss&&commentsNS) commentsNS.openComposer({element:document.getElementById(b.dataset.discuss)}).catch(function(){});
});
app.addEventListener("keydown",function(ev){if(ev.key!=="Enter"&&ev.key!==" ")return;
  if(ev.target.matches("[data-node]")){ev.preventDefault();pick(ev.target.dataset.node);}
  else if(ev.target.matches("[data-step]")){ev.preventDefault();stop();go(+ev.target.dataset.step);}});

render();
var started=false;function initCaps(){if(started||!(window.claude&&window.claude.use))return;started=true;
  window.claude.use("artifact").then(function(a){artifactNS=a;if(a&&!editing)render();}).catch(function(){});
  window.claude.use("comments").then(function(c){commentsNS=c;if(c&&!editing)render();}).catch(function(){});}
if(!STATIC){initCaps();window.addEventListener("load",initCaps);}
})();
</script></body></html>
